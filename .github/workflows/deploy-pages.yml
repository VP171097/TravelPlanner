name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed once, the very first time this workflow creates the Pages
  # site for the repo (Settings → Pages doesn't exist yet). Without
  # it, actions/configure-pages fails with "Get Pages site failed".
  # Safe to leave in place afterwards — it's only exercised on creation.
  administration: write

# Only one Pages deployment at a time; let in-flight runs finish rather
# than cancelling, so a deploy is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
