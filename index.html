<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TravelPlanner — AI-assisted trip planner</title>
<meta name="description" content="Plan smart itineraries, estimate budgets, get hotel &amp; restaurant ideas, and build packing checklists — fully offline, on your phone." />
<meta name="theme-color" content="#0f6e5b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TravelPlanner" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="app-header-title">
    <span class="app-logo">🧭</span>
    <div>
      <h1>TravelPlanner</h1>
      <p id="active-trip-sub" class="app-header-sub">No trip selected</p>
    </div>
  </div>
  <button id="btn-new-trip" class="btn btn-icon" aria-label="New trip" title="New trip">＋</button>
</header>

<main id="main">

  <!-- TRIPS -->
  <section id="view-trips" class="view active">
    <div id="offline-banner" class="banner hidden">📴 Offline — showing saved data. Everything still works.</div>
    <h2 class="section-title">Your trips</h2>
    <div id="trip-list" class="trip-list"></div>
    <div id="trip-empty" class="empty-state hidden">
      <p>No trips yet.</p>
      <button class="btn btn-primary" id="btn-new-trip-2">Plan your first trip</button>
    </div>
  </section>

  <!-- ITINERARY -->
  <section id="view-itinerary" class="view">
    <div class="view-toolbar">
      <h2 class="section-title">Itinerary</h2>
      <div style="display:flex; gap:8px;">
        <button id="btn-share-itinerary" class="btn btn-secondary btn-sm">📤 Share</button>
        <button id="btn-regen-itinerary" class="btn btn-secondary btn-sm">🔀 Regenerate</button>
      </div>
    </div>
    <div id="itinerary-content"></div>
  </section>

  <!-- BUDGET -->
  <section id="view-budget" class="view">
    <h2 class="section-title">Budget estimate</h2>
    <div id="budget-content"></div>
  </section>

  <!-- PLACES -->
  <section id="view-places" class="view">
    <h2 class="section-title">Hotels &amp; restaurants</h2>
    <div id="places-content"></div>
  </section>

  <!-- PACKING -->
  <section id="view-packing" class="view">
    <div class="view-toolbar">
      <h2 class="section-title">Packing checklist</h2>
      <button id="btn-regen-packing" class="btn btn-secondary">🔄 Rebuild</button>
    </div>
    <div id="packing-content"></div>
  </section>

</main>

<nav class="bottom-nav" id="bottom-nav">
  <button class="nav-btn active" data-view="view-trips"><span>🧭</span><small>Trips</small></button>
  <button class="nav-btn" data-view="view-itinerary"><span>🗓️</span><small>Itinerary</small></button>
  <button class="nav-btn" data-view="view-budget"><span>💰</span><small>Budget</small></button>
  <button class="nav-btn" data-view="view-places"><span>🏨</span><small>Places</small></button>
  <button class="nav-btn" data-view="view-packing"><span>🎒</span><small>Packing</small></button>
</nav>

<!-- NEW / EDIT TRIP FORM (full-screen overlay) -->
<div id="trip-form-overlay" class="overlay hidden">
  <div class="overlay-sheet">
    <div class="overlay-header">
      <h2 id="trip-form-title">New trip</h2>
      <button id="btn-close-form" class="btn btn-icon" aria-label="Close">✕</button>
    </div>
    <form id="trip-form" class="trip-form">
      <input type="hidden" id="f-id" />

      <label class="field">
        <span>Destination</span>
        <input type="text" id="f-destination" placeholder="e.g. Lisbon, Portugal" required />
      </label>

      <div class="field-row">
        <label class="field">
          <span>Start date</span>
          <input type="date" id="f-start" required />
        </label>
        <label class="field">
          <span>End date</span>
          <input type="date" id="f-end" required />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Travelers</span>
          <input type="number" id="f-travelers" min="1" value="1" required />
        </label>
        <label class="field">
          <span>Budget level</span>
          <select id="f-budget-tier">
            <option value="budget">Budget</option>
            <option value="mid" selected>Mid-range</option>
            <option value="luxury">Luxury</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Pace</span>
          <select id="f-pace">
            <option value="relaxed">Relaxed (2 activities/day)</option>
            <option value="balanced" selected>Balanced (3/day)</option>
            <option value="packed">Packed (4/day)</option>
          </select>
        </label>
        <label class="field">
          <span>Region (for cost estimate)</span>
          <select id="f-region"></select>
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Climate</span>
          <select id="f-climate"></select>
        </label>
        <label class="field">
          <span>Trip type</span>
          <select id="f-trip-type"></select>
        </label>
      </div>

      <fieldset class="field">
        <legend>Interests</legend>
        <div id="f-interests" class="chip-group"></div>
      </fieldset>

      <div class="field-row">
        <label class="field">
          <span>Flight est. per person ($, optional)</span>
          <input type="number" id="f-flight" min="0" placeholder="0" />
        </label>
        <label class="field">
          <span>Hotel rooms (optional)</span>
          <input type="number" id="f-rooms" min="1" placeholder="auto" />
        </label>
      </div>

      <div class="overlay-actions">
        <button type="button" id="btn-delete-trip" class="btn btn-danger hidden">Delete trip</button>
        <button type="submit" class="btn btn-primary">Save trip</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/itinerary.js"></script>
<script src="js/budget.js"></script>
<script src="js/places.js"></script>
<script src="js/packing.js"></script>
<script src="js/app.js"></script>
</body>
</html>
